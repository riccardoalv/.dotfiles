# Teclas multimídia com OSD (swayosd) — fallback para pamixer/brightnessctl
# enquanto o swayosd não estiver instalado (rebuild pendente)
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, swayosd-client --output-volume raise || pamixer -i 5
bindeld = ,XF86AudioLowerVolume, Volume down, exec, swayosd-client --output-volume lower || pamixer -d 5
bindeld = ,XF86AudioMute, Mute, exec, swayosd-client --output-volume mute-toggle || pamixer -t
bindeld = ,XF86AudioMicMute, Mute microphone, exec, swayosd-client --input-volume mute-toggle || pamixer --default-source -t
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, swayosd-client --brightness raise || brightnessctl s 5%+
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, swayosd-client --brightness lower || brightnessctl s 5%-
bindeld = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, brightnessctl s 100%
bindeld = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, brightnessctl s 1%

# Ajuste fino de 1% com Alt
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, swayosd-client --output-volume +1 || pamixer -i 1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, swayosd-client --output-volume -1 || pamixer -d 1

# Controle de mídia (playerctl)
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPause, Pause, exec, playerctl play-pause
bindld = , XF86AudioPlay, Play, exec, playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous
