# Menus
bindd = SUPER, SPACE, Launch apps, exec, pkill wofi || wofi --show drun
bindd = SUPER, ESCAPE, System menu, exec, ~/.config/hypr/scripts/power-menu.sh
bindld = , XF86PowerOff, Power menu, exec, ~/.config/hypr/scripts/power-menu.sh
# (em SUPER+/ porque SUPER+K é vim motion de foco)
bindd = SUPER, SLASH, Show key bindings, exec, ~/.config/hypr/scripts/keybindings.sh

# Estética
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, pkill -SIGUSR1 waybar

# Notificações (mako)
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, makoctl mode -t do-not-disturb
bindd = SUPER ALT, COMMA, Invoke last notification, exec, makoctl invoke
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# Capturas de tela (hyprshot salva em ~/Pictures e copia pro clipboard)
bindd = , PRINT, Screenshot region, exec, hyprshot -m region
bindd = SHIFT, PRINT, Screenshot window, exec, hyprshot -m window
bindd = CTRL, PRINT, Screenshot screen, exec, hyprshot -m output
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

# Zoom
bindd = SUPER CTRL, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1

# Mostrar hora (útil com a barra escondida)
bindd = SUPER CTRL ALT, T, Show time, exec, notify-send -u low "    $(date +"%A %H:%M  ·  %d %B %Y  ·  Semana %V")"

# Painéis de controle
bindd = SUPER CTRL, W, Wifi controls, exec, alacritty --class=TUI.float -e nmtui
bindd = SUPER CTRL, T, Activity, exec, alacritty --class=TUI.float -e btop

# Bloquear sessão
bindd = SUPER CTRL, L, Lock system, exec, loginctl lock-session
