# https://wiki.hypr.land/Configuring/Basics/Variables/#input
input {
    kb_layout = us,br
    # Troca de layout: Alt esquerdo + Alt direito (grp:alts_toggle)
    # (grp:win_space_toggle removido — Super+Space agora abre o launcher)
    kb_options = ctrl:swapcaps,fkeys:basic_13-24,scrolllock:mod3,grp:alts_toggle

    repeat_rate = 40
    repeat_delay = 250

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.4
    }
}

# Scroll mais agradável no terminal
windowrule = match:class Alacritty, scroll_touchpad 1.5

# Gestos de touchpad para trocar de workspace (sintaxe nova, substitui gestures:workspace_swipe)
gesture = 3, horizontal, workspace

misc {
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}
