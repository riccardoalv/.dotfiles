# Bindings de aplicativos (estilo Omarchy, adaptado aos seus apps)
$terminal = alacritty
$browser = google-chrome-stable
$fileManager = nautilus
$music = spotify

bindd = SUPER, RETURN, Terminal, exec, $terminal
bindd = SUPER ALT, RETURN, Tmux, exec, $terminal -e fish -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (anônimo), exec, $browser --incognito
bindd = SUPER SHIFT, F, File manager, exec, $fileManager --new-window
bindd = SUPER SHIFT, M, Music, exec, $music
bindd = SUPER SHIFT, G, Discord (Vesktop), exec, vesktop

# Web apps (se a URL tiver #, escreva ## para o hyprland não tratar como comentário)
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, $browser --app="https://web.whatsapp.com"
