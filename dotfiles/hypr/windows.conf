# See https://wiki.hypr.land/Configuring/Basics/Window-Rules/
# Sintaxe Hyprland 0.53+

windowrule = suppress_event maximize, match:class .*

# Marca todas as janelas para opacidade padrão (apps podem remover a tag)
windowrule = tag +default-opacity, match:class .*

# Corrige problemas de drag com XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# Terminais com leve transparência
windowrule = tag +terminal, match:class (Alacritty|kitty|com.mitchellh.ghostty|foot)
windowrule = tag -default-opacity, match:tag terminal
windowrule = opacity 0.97 0.9, match:tag terminal

# Janelas flutuantes
windowrule = float on, match:tag floating-window
windowrule = center on, match:tag floating-window
windowrule = size 875 600, match:tag floating-window

windowrule = tag +floating-window, match:class (org.gnome.NautilusPreviewer|org.gnome.Evince|TUI.float|imv|mpv)
windowrule = tag +floating-window, match:class (xdg-desktop-portal-gtk|org.gnome.Nautilus), match:title ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to [open|save].*|[C|c]hoose.*)
windowrule = float on, match:class org.gnome.Calculator

# Sem transparência em janelas de mídia
windowrule = tag -default-opacity, match:class ^(zoom|vlc|mpv|com.obsproject.Studio|imv|org.gnome.NautilusPreviewer)$
windowrule = opacity 1 1, match:class ^(zoom|vlc|mpv|com.obsproject.Studio|imv|org.gnome.NautilusPreviewer)$

# Picture-in-picture
windowrule = tag +pip, match:title (Picture.?in.?[Pp]icture)
windowrule = tag -default-opacity, match:tag pip
windowrule = float on, match:tag pip
windowrule = pin on, match:tag pip
windowrule = size 600 338, match:tag pip
windowrule = keep_aspect_ratio on, match:tag pip
windowrule = border_size 0, match:tag pip
windowrule = opacity 1 1, match:tag pip
windowrule = move (monitor_w-window_w-40) (monitor_h*0.04), match:tag pip

# Aplica opacidade padrão por último
windowrule = opacity 0.97 0.9, match:tag default-opacity
